<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile - ACHRON</title>
</head>
<body>

<h1>✏️ Edit Profile</h1>

<form method="POST">

    <label>Full Name</label><br>
    <input type="text" name="full_name" value="{{ user[0] }}" required><br><br>

    <label>Phone Number</label><br>
    <input type="text" name="phone" value="{{ user[2] }}" required><br><br>

    <button type="submit">💾 Save Changes</button>

</form>

<br>

<a href="/profile">⬅ Back to Profile</a>

</body>
</html>
