<!DOCTYPE html>
<html>
<head>
    <title>ACHRON Booking</title>
</head>
<body>

<h1>🧳 ACHRON Travel Agent</h1>

<h2>New Booking</h2>

<form method="POST" action="/booking">

    <label>Destination:</label><br>
    <input type="text" name="destination" required>
    <br><br>

    <label>Travel Date:</label><br>
    <input type="date" name="travel_date" required>
    <br><br>

    <label>Number of Travellers:</label><br>
    <input type="number" name="travellers" min="1" required>
    <br><br>

    <label>Hotel ID:</label><br>
    <input type="number" name="hotel_id">
    <br><br>

    <label>Flight ID:</label><br>
    <input type="number" name="flight_id">
    <br><br>

    <label>Seat Number:</label><br>
    <input type="text" name="seat_number">
    <br><br>

    <label>Total Amount:</label><br>
    <input type="number" name="total_amount" min="0" step="0.01" required>
    <br><br>

    <button type="submit">✅ Confirm Booking</button>

</form>

<br>

<a href="/dashboard">⬅️ Back to Dashboard</a>

</body>
</html>
